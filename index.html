<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      iOS no lee SVG en `apple-touch-icon`: un iPhone que añadía structureCo a
      la pantalla de inicio se quedaba sin icono y pintaba una miniatura de la
      página. El PNG de 180 px lo genera `scripts/generate-app-icons.mjs` a
      partir del mismo SVG, así que no hay dos marcas que mantener.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <!-- `viewport-fit=cover` es lo que hace que `env(safe-area-inset-*)` deje de
         valer 0 y la aplicación pueda llegar al borde físico de la pantalla. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      El color de la barra de estado es el FONDO de la aplicación, no el verde
      de la marca: con el verde, un iPhone dibujaba una franja lima sobre un
      marfil que no la continuaba. `platform/nativeShell.ts` reemplaza esta
      etiqueta al cambiar de tema; éstas son las dos de primer pintado.
    -->
    <meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07161b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="structureCo" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="structureCo: modelado, análisis y aprendizaje interactivo de estructuras planas 2D, con un espacio 3D separado." />
    <!--
      Tarjeta social con rutas relativas: el sitio se publica en más de un
      origen y fijar un host aquí publicaría una URL falsa en el otro. Los
      rastreadores principales resuelven `og:image` contra la propia página.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="structureCo" />
    <meta property="og:title" content="structureCo · Análisis estructural" />
    <meta property="og:description" content="Modela, analiza y explica estructuras en el navegador. Marcos, vigas y armaduras en 2D, y un espacio 3D separado con cargas de barra, liberaciones y diagramas." />
    <meta property="og:image" content="./assets/structural/day/portal/single-bay.png" />
    <meta property="og:image:width" content="900" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="Pórtico plano de un vano representado con la dirección visual de structureCo." />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>structureCo · Análisis estructural 2D</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
