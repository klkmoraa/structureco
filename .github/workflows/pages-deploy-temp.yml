name: Temporary GitHub Pages handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-deploy-temp.yml'

permissions:
  contents: write

concurrency:
  group: structureco-pages-handoff
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      - name: Node canónico
        uses: actions/setup-node@v4
        with:
          node-version-file: 'app/.nvmrc'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install exact dependencies
        working-directory: app
        run: npm ci

      - name: Build production site
        working-directory: app
        run: npm run build

      - name: Checkout current Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Replace Pages tree atomically at push
        shell: bash
        run: |
          rsync -a --delete --exclude='.git' app/dist/ site/
          touch site/.nojekyll
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'GitHub Pages already matches the verified production build.'
          else
            git commit -m "deploy: publish main ${GITHUB_SHA::12} to GitHub Pages"
            git push origin HEAD:gh-pages
          fi
