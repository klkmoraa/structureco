<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>structureCo — Diagramas que Cobran Vida</title>
    <script src="../_shared/vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg: #060b09;
        --surface-1: #101915;
        --surface-2: #16231d;
        --border: #2c3539;
        --member: #f1f5f4;
        --accent: #39d4a2;
        --text-primary: #f2f7f4;
        --text-secondary: #b8c8c0;
        --text-muted: #91a299;
        --load: #ff7d66;
        --axial: #6bcbf1;
        --shear: #78dc94;
        --moment: #ff79ac;
        --deformed: #5bdae2;
        --dimension: #ffd56a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "Inter", sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .bg-plate {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 1250px 800px at 50% 40%, #0a1512 0%, var(--bg) 66%);
      }

      /* the structure holds absolutely still — only the reading changes */
      .model-zone {
        position: absolute;
        left: 0;
        top: 74px;
        width: 1920px;
        height: 400px;
      }
      .model-zone svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .member {
        fill: none;
        stroke: var(--member);
        stroke-width: 4.5;
        stroke-linecap: round;
      }
      .node {
        fill: var(--bg);
        stroke: var(--accent);
        stroke-width: 3.5;
      }
      .support {
        fill: none;
        stroke: var(--text-secondary);
        stroke-width: 2.5;
      }
      .load-arrow {
        stroke: var(--load);
        stroke-width: 3.5;
        fill: none;
        stroke-linecap: round;
      }

      /* the diagram stack: one plate, four readings crossfading in place */
      .reading-plate {
        position: absolute;
        left: 300px;
        top: 496px;
        width: 1320px;
        height: 336px;
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px 30px 18px;
        opacity: 0;
      }
      .reading-head {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }
      .reading-key {
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .reading-title {
        font-size: 28px;
        font-weight: 750;
        color: var(--text-primary);
      }
      .reading-max {
        margin-left: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        font-weight: 700;
      }
      .plot {
        position: absolute;
        left: 30px;
        top: 92px;
        width: 1260px;
        height: 220px;
      }
      .plot svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .reading {
        opacity: 0;
      }
      .peak-dot {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }

      /* tab strip mirrors the real Centro Analítico */
      .tabs {
        position: absolute;
        left: 300px;
        top: 430px;
        display: flex;
        gap: 12px;
        opacity: 0;
      }
      .tab {
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 9px 20px;
        font-size: 20px;
        font-weight: 600;
        color: var(--text-muted);
        background: var(--surface-1);
      }

      .beat {
        position: absolute;
        left: 360px;
        top: 900px;
        width: 1200px;
        text-align: center;
        font-size: 62px;
        font-weight: 780;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        opacity: 0;
      }
      .closing {
        position: absolute;
        left: 210px;
        top: 494px;
        width: 1500px;
        text-align: center;
        font-size: 62px;
        font-weight: 800;
        letter-spacing: -0.022em;
        color: var(--text-primary);
        opacity: 0;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: #040706;
        opacity: 0;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 1440px 980px at 50% 50%, transparent 50%, #030503 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="24"
    >
      <section id="scene" class="clip" data-start="0" data-duration="24" data-track-index="1">
        <div class="bg-plate"></div>

        <!-- the model never moves -->
        <div class="model-zone" id="modelZone">
          <svg viewBox="0 0 1920 400" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="gp" width="56" height="56" patternUnits="userSpaceOnUse">
                <path d="M 56 0 L 0 0 0 56" fill="none" stroke="#202a2b" stroke-width="1" />
              </pattern>
            </defs>
            <rect width="1920" height="400" fill="url(#gp)" opacity="0.35" />

            <path class="member" d="M 360 210 L 1560 210" />
            <path class="member" d="M 360 210 L 360 300" />
            <path class="member" d="M 1560 210 L 1560 300" />
            <path class="support" d="M 360 300 L 336 340 L 384 340 Z M 328 348 L 392 348" />
            <path class="support" d="M 1560 300 L 1536 340 L 1584 340 Z M 1528 348 L 1592 348" />

            <path class="load-arrow" d="M 760 104 L 760 188" />
            <path class="load-arrow" d="M 749 174 L 760 192 L 771 174" />
            <path class="load-arrow" d="M 1160 104 L 1160 188" />
            <path class="load-arrow" d="M 1149 174 L 1160 192 L 1171 174" />

            <!-- deformed overlay stays hidden until its reading -->
            <path id="defOverlay" fill="none" stroke="#5bdae2" stroke-width="3.5" opacity="0" d="M 360 210 Q 960 296 1560 210" />

            <circle class="node" cx="360" cy="210" r="9" />
            <circle class="node" cx="1560" cy="210" r="9" />
          </svg>
        </div>

        <div class="vignette"></div>

        <div class="tabs" id="tabs">
          <span class="tab" id="tabAx">Axial</span>
          <span class="tab" id="tabSh">Cortante</span>
          <span class="tab" id="tabMo">Momento</span>
          <span class="tab" id="tabDe">Deformada</span>
        </div>

        <div class="reading-plate" id="plate">
          <div class="reading-head">
            <span class="reading-key" id="rKey">N</span>
            <span class="reading-title" id="rTitle">Diagrama de fuerza axial</span>
            <span class="reading-max" id="rMax">N máx = 12.40 kN</span>
          </div>
          <div class="plot">
            <svg viewBox="0 0 1260 220" xmlns="http://www.w3.org/2000/svg">
              <line x1="30" y1="110" x2="1230" y2="110" stroke="#2c3539" stroke-width="1.5" />

              <g class="reading" id="rdAx">
                <path id="pAx" fill="rgba(107,203,241,0.14)" stroke="#6bcbf1" stroke-width="3.5" d="M 30 74 L 1230 74 L 1230 110 L 30 110 Z" />
                <circle id="dotAx" class="peak-dot" cx="630" cy="74" r="8" fill="#6bcbf1" />
              </g>

              <g class="reading" id="rdSh">
                <path id="pSh" fill="rgba(120,220,148,0.14)" stroke="#78dc94" stroke-width="3.5" d="M 30 40 L 430 40 L 430 110 L 830 110 L 830 180 L 1230 180 L 1230 110 L 30 110 Z" />
                <circle id="dotSh" class="peak-dot" cx="230" cy="40" r="8" fill="#78dc94" />
              </g>

              <g class="reading" id="rdMo">
                <path id="pMo" fill="rgba(255,121,172,0.14)" stroke="#ff79ac" stroke-width="3.5" d="M 30 110 L 430 34 L 830 34 L 1230 110 Z" />
                <circle id="dotMo" class="peak-dot" cx="630" cy="34" r="9" fill="#ffd56a" />
              </g>

              <g class="reading" id="rdDe">
                <path id="pDe" fill="none" stroke="#5bdae2" stroke-width="3.5" d="M 30 110 Q 630 208 1230 110" />
                <circle id="dotDe" class="peak-dot" cx="630" cy="159" r="8" fill="#5bdae2" />
              </g>
            </svg>
          </div>
        </div>

        <div class="beat" id="beat1">Una estructura.</div>
        <div class="beat" id="beat2">Diferentes formas de leerla.</div>

        <div class="scrim" id="scrim"></div>
        <div class="closing" id="closing">Resultados que impulsan decisiones.</div>
      </section>

      <audio id="bed" src="assets/bed.mp3" data-start="0" data-duration="24" data-track-index="10" data-volume="0.9"></audio>
      <audio id="sfx-plate" src="../_shared/sfx/whoosh-short.mp3" data-start="2.60" data-duration="0.57" data-track-index="11" data-volume="0.28"></audio>
      <audio id="sfx-r1" src="../_shared/sfx/click.mp3" data-start="3.20" data-duration="0.36" data-track-index="12" data-volume="0.26"></audio>
      <audio id="sfx-r2" src="../_shared/sfx/click.mp3" data-start="7.20" data-duration="0.36" data-track-index="12" data-volume="0.26"></audio>
      <audio id="sfx-r3" src="../_shared/sfx/click.mp3" data-start="11.20" data-duration="0.36" data-track-index="12" data-volume="0.26"></audio>
      <audio id="sfx-r4" src="../_shared/sfx/click.mp3" data-start="15.20" data-duration="0.36" data-track-index="12" data-volume="0.26"></audio>
      <audio id="sfx-peak" src="../_shared/sfx/ping.mp3" data-start="12.60" data-duration="1.32" data-track-index="13" data-volume="0.30"></audio>
      <audio id="sfx-close" src="../_shared/sfx/impact-bass-1.mp3" data-start="20.80" data-duration="2.10" data-track-index="14" data-volume="0.32"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      function prep(id) {
        const el = document.getElementById(id);
        const len = el.getTotalLength();
        el.style.strokeDasharray = `${len}`;
        el.style.strokeDashoffset = `${len}`;
      }
      ["pAx", "pSh", "pMo", "pDe"].forEach(prep);

      const rKey = document.getElementById("rKey");
      const rTitle = document.getElementById("rTitle");
      const rMax = document.getElementById("rMax");

      // ---------- 0–3s · the analysed structure, held still ----------
      tl.fromTo("#modelZone", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.2);
      tl.to("#tabs", { opacity: 1, duration: 0.6, ease: "power3.out" }, 2.2);
      tl.fromTo("#plate", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 2.6);

      // Each reading is the same plate re-labelled — the structure never moves,
      // so the viewer reads four views of ONE model rather than four scenes.
      function reading(at, id, tabId, key, title, max, color, dotId) {
        tl.set(rKey, { color }, at);
        tl.call(
          () => {
            rKey.textContent = key;
            rTitle.textContent = title;
            rMax.textContent = max;
            rMax.style.color = color;
          },
          null,
          at,
        );
        tl.set(`#${tabId}`, { color, borderColor: color }, at);
        tl.to(`#${id}`, { opacity: 1, duration: 0.5, ease: "power2.out" }, at);
        tl.to(`#${id} path`, { strokeDashoffset: 0, duration: 1.5, ease: "power2.out" }, at);
        tl.fromTo(`#${dotId}`, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, at + 1.4);
      }

      function clearReading(at, id, tabId) {
        tl.to(`#${id}`, { opacity: 0, duration: 0.5, ease: "power2.in" }, at);
        tl.set(`#${tabId}`, { color: "#91a299", borderColor: "#2c3539" }, at + 0.5);
      }

      // 3.2s · axial
      reading(3.2, "rdAx", "tabAx", "N", "Diagrama de fuerza axial", "N máx = 12.40 kN", "#6bcbf1", "dotAx");

      // 7.2s · shear
      clearReading(6.9, "rdAx", "tabAx");
      reading(7.2, "rdSh", "tabSh", "V", "Diagrama de cortante", "V máx = 24.00 kN", "#78dc94", "dotSh");

      // 11.2s · moment, with the camera easing toward the peak
      clearReading(10.9, "rdSh", "tabSh");
      reading(11.2, "rdMo", "tabMo", "M", "Diagrama de momento flector", "M máx = 68.00 kN·m", "#ff79ac", "dotMo");

      const zoom = { s: 1, y: 0 };
      const plate = document.getElementById("plate");
      tl.to(
        zoom,
        {
          s: 1.07,
          y: -14,
          duration: 1.4,
          ease: "power2.inOut",
          onUpdate: () => {
            plate.style.transform = `scale(${zoom.s}) translateY(${zoom.y}px)`;
          },
        },
        12.6,
      );
      tl.to(
        zoom,
        {
          s: 1,
          y: 0,
          duration: 1.0,
          ease: "power2.inOut",
          onUpdate: () => {
            plate.style.transform = `scale(${zoom.s}) translateY(${zoom.y}px)`;
          },
        },
        14.2,
      );

      // 15.2s · deformed — also overlaid on the structure itself
      clearReading(14.9, "rdMo", "tabMo");
      reading(15.2, "rdDe", "tabDe", "δ", "Deformada", "δ máx = 18.20 mm", "#5bdae2", "dotDe");
      tl.to("#defOverlay", { opacity: 0.9, duration: 1.0, ease: "power2.out" }, 15.4);

      // ---------- 18.6–21s · the message ----------
      tl.to("#beat1", { opacity: 1, duration: 0.7, ease: "power3.out" }, 18.6);
      tl.to("#beat1", { opacity: 0, duration: 0.5, ease: "power2.in" }, 19.8);
      tl.to("#beat2", { opacity: 1, duration: 0.7, ease: "power3.out" }, 20.1);
      tl.to("#beat2", { opacity: 0, duration: 0.5, ease: "power2.in" }, 21.1);

      // ---------- 20.8–24s · close ----------
      tl.to("#scrim", { opacity: 0.96, duration: 1.3, ease: "power2.inOut" }, 20.8);
      tl.to("#modelZone, #plate, #tabs", { opacity: 0, duration: 1.3, ease: "power2.inOut" }, 20.8);
      tl.to("#closing", { opacity: 1, duration: 1.0, ease: "power3.out" }, 21.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
