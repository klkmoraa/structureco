# Gate completo — structureCo
#
# Candidato de release. Ejecuta las comprobaciones del Gate rápido más los recorridos de extremo a extremo en
# Chromium y WebKit: bienvenida responsive, importación/exportación .structureco, PDF nativo
# reimportable, edición táctil, Aula móvil y objetivos táctiles ≥44px en dispositivos reales
# emulados. Sólo se dispara manualmente — no hay trigger automático en push/PR, porque instala
# navegadores y tarda considerablemente más que el gate rápido.
#
# Sin IA (nada de Anthropic, OpenAI, Claude ni Codex), sin FTool gráfico, sin deploy, sin
# commits, sin tags, sin publicación de paquetes. Permisos mínimos.

name: Gate completo

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-qa:
    name: QA de release (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node canónico
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Instalar dependencias exactas
        run: npm ci

      # El gate rápido se invoca, no se reescribe. La lista inline anterior ya
      # había divergido —le faltaba `verify:perf`— y volvió a quedarse corta al
      # promover `verify:pwa` y `verify:i18n`: un candidato de release podía
      # pasar el Gate completo con esos gates en rojo. `npm run verify` es la
      # única definición y no puede desincronizarse de sí misma.
      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Gate rápido completo
        run: npm run verify

      - name: Capacidad de Space 3D
        run: npm run verify:space3d

      - name: Contrato de assets estructurales
        run: npm run verify:structural-assets

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: QA de geometría TopBar
        run: npm run qa:topbar

      - name: QA Chromium (desktop, móvil, Aula, importación)
        run: npm run qa

      - name: QA WebKit (iPhone, iPad, táctil, PDF nativo)
        run: npm run qa:webkit

      - name: Conservar evidencia (capturas, métricas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qa-evidence
          path: |
            qa-artifacts/
            dist/
          retention-days: 14
          if-no-files-found: warn
