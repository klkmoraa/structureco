<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>structureCo — Cómo Viaja una Carga</title>
    <script src="../_shared/vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg: #060b09;
        --member: #f1f5f4;
        --accent: #39d4a2;
        --surface-2: #16231d;
        --border: #2c3539;
        --text-primary: #f2f7f4;
        --text-secondary: #b8c8c0;
        --load: #ff7d66;
        --moment: #ff79ac;
        --reaction: #9baaff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "Inter", sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .bg-plate {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 1250px 820px at 50% 40%, #0a1512 0%, var(--bg) 66%);
      }
      .camera {
        position: absolute;
        inset: 0;
        transform-origin: 50% 42%;
        will-change: transform;
      }
      .layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .member {
        fill: none;
        stroke: var(--member);
        stroke-width: 4.5;
        stroke-linecap: round;
      }
      .node {
        fill: var(--bg);
        stroke: var(--accent);
        stroke-width: 3.5;
      }
      .support {
        fill: none;
        stroke: var(--text-secondary);
        stroke-width: 2.5;
      }
      .load-arrow {
        stroke: var(--load);
        stroke-width: 4.5;
        fill: none;
        stroke-linecap: round;
      }
      .reaction-arrow {
        stroke: var(--reaction);
        stroke-width: 4.5;
        fill: none;
        stroke-linecap: round;
      }
      .flow {
        fill: none;
        stroke: var(--load);
        stroke-width: 9;
        stroke-linecap: round;
        opacity: 0;
      }
      .moment-path {
        fill: none;
        stroke: var(--moment);
        stroke-width: 4;
      }
      .moment-fill {
        fill: rgba(255, 121, 172, 0.15);
        stroke: none;
      }
      .moment-base {
        stroke: var(--border);
        stroke-width: 1.5;
      }
      .peak-dot {
        fill: var(--moment);
        opacity: 0;
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      .chip {
        position: absolute;
        display: inline-flex;
        align-items: center;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 23px;
        font-weight: 700;
        white-space: nowrap;
        opacity: 0;
      }
      .chip.load {
        color: var(--load);
      }
      .chip.reaction {
        color: var(--reaction);
      }
      .chip.moment {
        color: var(--moment);
      }
      .chip.node-tag {
        color: var(--text-secondary);
        font-size: 20px;
      }
      .beat {
        position: absolute;
        left: 300px;
        width: 1320px;
        text-align: center;
        font-size: 62px;
        font-weight: 750;
        letter-spacing: -0.018em;
        color: var(--text-primary);
        opacity: 0;
      }
      .lockup {
        position: absolute;
        left: 856px;
        top: 916px;
        display: flex;
        align-items: center;
        gap: 14px;
        opacity: 0;
      }
      .lockup svg {
        width: 46px;
        height: 46px;
        display: block;
      }
      .lockup span {
        font-size: 34px;
        font-weight: 800;
        color: var(--text-primary);
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 1420px 960px at 50% 50%, transparent 48%, #030503 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="25"
    >
      <section id="scene" class="clip" data-start="0" data-duration="25" data-track-index="1">
        <div class="bg-plate"></div>

        <div class="camera" id="camera">
          <svg class="layer" id="grid" viewBox="0 0 1920 1080" style="opacity: 0" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="gp" width="60" height="60" patternUnits="userSpaceOnUse">
                <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#202a2b" stroke-width="1" />
              </pattern>
            </defs>
            <rect width="1920" height="1080" fill="url(#gp)" />
          </svg>

          <svg class="layer" id="model" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
            <g id="momGroup" opacity="0">
              <line class="moment-base" x1="620" y1="720" x2="1300" y2="720" />
              <path id="momFill" class="moment-fill" opacity="0" d="M 620 720 Q 960 900 1300 720 Z" />
              <path id="momPath" class="moment-path" d="M 620 720 Q 960 900 1300 720" />
              <circle id="peakDot" class="peak-dot" cx="960" cy="810" r="9" />
            </g>

            <path id="beam" class="member" d="M 620 360 L 1300 360" />
            <path id="colL" class="member" d="M 620 360 L 620 620" />
            <path id="colR" class="member" d="M 1300 360 L 1300 620" />

            <path id="flowBeamL" class="flow" d="M 960 360 L 620 360" />
            <path id="flowBeamR" class="flow" d="M 960 360 L 1300 360" />
            <path id="flowColL" class="flow" d="M 620 360 L 620 620" />
            <path id="flowColR" class="flow" d="M 1300 360 L 1300 620" />

            <path id="s1" class="support" d="M 620 620 L 594 660 L 646 660 Z M 586 668 L 654 668" />
            <path id="s2" class="support" d="M 1300 620 L 1274 660 L 1326 660 Z M 1266 668 L 1334 668" />

            <g id="loadGroup" opacity="0">
              <path class="load-arrow" d="M 960 214 L 960 336" />
              <path class="load-arrow" d="M 946 320 L 960 342 L 974 320" />
            </g>

            <g id="reactL" opacity="0">
              <path class="reaction-arrow" d="M 620 736 L 620 656" />
              <path class="reaction-arrow" d="M 606 670 L 620 650 L 634 670" />
            </g>
            <g id="reactR" opacity="0">
              <path class="reaction-arrow" d="M 1300 736 L 1300 656" />
              <path class="reaction-arrow" d="M 1286 670 L 1300 650 L 1314 670" />
            </g>

            <circle id="nL" class="node" cx="620" cy="360" r="10" />
            <circle id="nR" class="node" cx="1300" cy="360" r="10" />
            <circle id="nSL" class="node" cx="620" cy="620" r="10" />
            <circle id="nSR" class="node" cx="1300" cy="620" r="10" />
          </svg>
        </div>

        <div class="vignette"></div>

        <div class="camera" id="chipCam">
          <div class="chip load" id="chipP" style="left: 992px; top: 240px">P = 40.00 kN</div>
          <div class="chip node-tag" id="tagN1" style="left: 524px; top: 634px">N1</div>
          <div class="chip node-tag" id="tagN2" style="left: 1342px; top: 634px">N2</div>
          <div class="chip reaction" id="chipRL" style="left: 396px; top: 738px">R = 20.00 kN</div>
          <div class="chip reaction" id="chipRR" style="left: 1350px; top: 738px">R = 20.00 kN</div>
          <div class="chip moment" id="chipM" style="left: 992px; top: 800px">M máx = 68.00 kN·m</div>
        </div>

        <div class="beat" id="beat1" style="top: 872px">Una carga nunca actúa sola.</div>
        <div class="beat" id="beat2" style="top: 872px">Viaja a través de cada elemento.</div>
        <div class="beat" id="beat3" style="top: 372px">structureCo hace visible ese recorrido.</div>

        <div class="lockup" id="lockup">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <rect width="64" height="64" rx="15" fill="#157a55" />
            <path
              fill="#fff"
              d="M43.5 13.5H29C20.6 13.5 15.5 18 15.5 24.8c0 6.4 4.7 10.4 12.9 10.4h7.4c4.1 0 6.2 1.6 6.2 4.5 0 3-2.3 4.8-6.5 4.8H18V52h17.8C44.1 52 49 47.3 49 39.8c0-6.7-4.6-10.7-12.8-10.7h-7.4c-4.2 0-6.3-1.5-6.3-4.2 0-2.5 2.3-4.1 6.7-4.1h14.3v-7.3Z"
            />
          </svg>
          <span>structureCo</span>
        </div>
      </section>

      <audio id="bed" src="assets/bed.mp3" data-start="0" data-duration="25" data-track-index="10" data-volume="0.9"></audio>
      <audio id="sfx-drop" src="assets/impact-bass-2.mp3" data-start="3.20" data-duration="2.59" data-track-index="11" data-volume="0.34"></audio>
      <audio id="sfx-flow1" src="assets/whoosh-short.mp3" data-start="6.30" data-duration="0.57" data-track-index="12" data-volume="0.26"></audio>
      <audio id="sfx-flow2" src="assets/whoosh-short.mp3" data-start="8.40" data-duration="0.57" data-track-index="12" data-volume="0.26"></audio>
      <audio id="sfx-react1" src="assets/click.mp3" data-start="12.10" data-duration="0.36" data-track-index="13" data-volume="0.30"></audio>
      <audio id="sfx-react2" src="assets/click.mp3" data-start="12.50" data-duration="0.36" data-track-index="13" data-volume="0.30"></audio>
      <audio id="sfx-diag" src="assets/whoosh-cinematic.mp3" data-start="15.80" data-duration="3.40" data-track-index="14" data-volume="0.15"></audio>
      <audio id="sfx-peak" src="assets/ping.mp3" data-start="19.30" data-duration="1.32" data-track-index="15" data-volume="0.30"></audio>
      <audio id="sfx-close" src="assets/chime.mp3" data-start="21.60" data-duration="2.50" data-track-index="16" data-volume="0.16"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      function prep(id) {
        const el = document.getElementById(id);
        const len = el.getTotalLength();
        el.style.strokeDasharray = `${len}`;
        el.style.strokeDashoffset = `${len}`;
      }
      ["beam", "colL", "colR", "s1", "s2", "momPath"].forEach(prep);

      // force-flow pulse: a short dash travelling the full member length
      function flowPulse(id, at, dur) {
        const el = document.getElementById(id);
        const len = el.getTotalLength();
        tl.set(`#${id}`, { opacity: 0.9 }, at);
        tl.fromTo(
          `#${id}`,
          { strokeDasharray: `90 ${len}`, strokeDashoffset: len },
          { strokeDashoffset: -90, duration: dur, ease: "power1.inOut" },
          at,
        );
        tl.to(`#${id}`, { opacity: 0, duration: 0.3, ease: "power2.in" }, at + dur - 0.15);
      }

      // ---------- 0–3s · the bare frame ----------
      tl.to("#grid", { opacity: 0.4, duration: 1.2, ease: "power2.out" }, 0.2);
      tl.to("#beam", { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 0.7);
      tl.to("#colL", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 1.3);
      tl.to("#colR", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 1.5);
      tl.to("#s1", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2.0);
      tl.to("#s2", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2.0);
      tl.fromTo("#tagN1", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.3);
      tl.fromTo("#tagN2", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.4);

      // ---------- 3–6s · the load lands ----------
      tl.fromTo("#loadGroup", { opacity: 0, y: -50 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 3.2);
      tl.fromTo("#chipP", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.7);
      tl.to("#beat1", { opacity: 1, duration: 0.7, ease: "power3.out" }, 4.2);

      // ---------- 6–11.5s · the force travels ----------
      flowPulse("flowBeamL", 6.3, 1.5);
      flowPulse("flowBeamR", 6.3, 1.5);
      flowPulse("flowColL", 7.7, 1.3);
      flowPulse("flowColR", 7.7, 1.3);
      flowPulse("flowBeamL", 8.4, 1.6);
      flowPulse("flowBeamR", 8.4, 1.6);
      flowPulse("flowColL", 9.8, 1.4);
      flowPulse("flowColR", 9.8, 1.4);

      tl.to("#beat1", { opacity: 0, duration: 0.5, ease: "power2.in" }, 8.6);
      tl.to("#beat2", { opacity: 1, duration: 0.7, ease: "power3.out" }, 9.2);

      // ---------- 12–14.5s · reactions ----------
      tl.fromTo("#reactL", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 12.1);
      tl.fromTo("#reactR", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 12.5);
      tl.fromTo("#chipRL", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 12.6);
      tl.fromTo("#chipRR", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 12.9);
      tl.to("#beat2", { opacity: 0, duration: 0.5, ease: "power2.in" }, 14.4);

      // ---------- 15.5–20s · the moment diagram draws itself ----------
      tl.to("#momGroup", { opacity: 1, duration: 0.5, ease: "power2.out" }, 15.5);
      tl.to("#momPath", { strokeDashoffset: 0, duration: 2.4, ease: "power2.out" }, 15.8);
      tl.to("#momFill", { opacity: 1, duration: 1.0, ease: "power2.out" }, 17.4);
      tl.fromTo("#peakDot", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 19.3);
      tl.fromTo("#chipM", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 19.5);

      // ---------- 19.4–21.6s · ease toward the critical value ----------
      const cam = { s: 1, y: 0 };
      const camEls = [document.getElementById("camera"), document.getElementById("chipCam")];
      tl.to(
        cam,
        {
          s: 1.16,
          y: -66,
          duration: 2.2,
          ease: "power2.inOut",
          onUpdate: () => {
            const t = `scale(${cam.s}) translateY(${cam.y}px)`;
            camEls.forEach((el) => (el.style.transform = t));
          },
        },
        19.4,
      );

      // ---------- 21.4–25s · close ----------
      tl.to("#camera, #chipCam", { opacity: 0.15, duration: 1.1, ease: "power2.inOut" }, 21.4);
      tl.to("#beat3", { opacity: 1, duration: 0.9, ease: "power3.out" }, 21.7);
      tl.to("#lockup", { opacity: 1, duration: 0.8, ease: "power3.out" }, 22.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
