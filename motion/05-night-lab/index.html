<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>structureCo — Laboratorio Nocturno</title>
    <script src="../_shared/vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg: #060b09;
        --surface-2: #16231d;
        --border: #2c3539;
        --member: #f1f5f4;
        --accent: #39d4a2;
        --text-primary: #f2f7f4;
        --text-secondary: #b8c8c0;
        --text-muted: #91a299;
        --load: #ff7d66;
        --axial: #6bcbf1;
        --shear: #78dc94;
        --moment: #ff79ac;
        --deformed: #5bdae2;
        --reaction: #9baaff;
        --dimension: #ffd56a;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030503;
      }
      body {
        font-family: "Inter", sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030503;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .bg-plate {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 1200px 800px at 50% 46%, #08110e 0%, #030503 68%);
      }

      /* each layer of the instrument sits at its own depth */
      .depth {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        will-change: transform, filter;
      }
      .layer-label {
        position: absolute;
        left: 168px;
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0;
      }

      .member {
        fill: none;
        stroke: var(--member);
        stroke-width: 4;
        stroke-linecap: round;
      }
      .node {
        fill: var(--bg);
        stroke: var(--accent);
        stroke-width: 3.5;
      }
      .support {
        fill: none;
        stroke: var(--text-secondary);
        stroke-width: 2.5;
      }
      .load-arrow {
        stroke: var(--load);
        stroke-width: 3.5;
        fill: none;
        stroke-linecap: round;
      }
      .reaction-arrow {
        stroke: var(--reaction);
        stroke-width: 4;
        fill: none;
        stroke-linecap: round;
      }
      .chip {
        position: absolute;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 5px 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 21px;
        font-weight: 700;
        white-space: nowrap;
        opacity: 0;
      }
      .chip.load {
        color: var(--load);
      }
      .chip.reaction {
        color: var(--reaction);
      }
      .chip.crit {
        color: var(--dimension);
        border-color: var(--dimension);
        font-size: 24px;
      }
      .crit-ring {
        position: absolute;
        width: 74px;
        height: 74px;
        border: 2px solid var(--dimension);
        border-radius: 50%;
        opacity: 0;
      }

      .beat {
        position: absolute;
        left: 168px;
        width: 900px;
        font-size: 64px;
        font-weight: 780;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        opacity: 0;
      }
      .closing {
        position: absolute;
        left: 210px;
        top: 470px;
        width: 1500px;
        text-align: center;
        opacity: 0;
      }
      .closing .kicker {
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .closing .title {
        font-size: 86px;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: var(--text-primary);
        margin-top: 16px;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 1400px 940px at 50% 50%, transparent 44%, #010302 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="24"
    >
      <section id="scene" class="clip" data-start="0" data-duration="24" data-track-index="1">
        <div class="bg-plate"></div>

        <!-- DEPTH 1 · grid -->
        <div class="depth" id="dGrid">
          <svg viewBox="0 0 1920 1080" style="width: 100%; height: 100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <pattern id="gp" width="54" height="54" patternUnits="userSpaceOnUse">
                <path d="M 54 0 L 0 0 0 54" fill="none" stroke="#202a2b" stroke-width="1" />
              </pattern>
            </defs>
            <rect id="gridRect" width="1920" height="1080" fill="url(#gp)" opacity="0" />
            <line id="axH" x1="0" y1="540" x2="1920" y2="540" stroke="#2c3539" stroke-width="1" opacity="0" />
            <line id="axV" x1="960" y1="0" x2="960" y2="1080" stroke="#2c3539" stroke-width="1" opacity="0" />
          </svg>
        </div>

        <!-- DEPTH 2 · geometry -->
        <div class="depth" id="dGeom">
          <svg viewBox="0 0 1920 1080" style="width: 100%; height: 100%" xmlns="http://www.w3.org/2000/svg">
            <path id="beam" class="member" d="M 660 400 L 1260 400" />
            <path id="colL" class="member" d="M 660 400 L 660 640" />
            <path id="colR" class="member" d="M 1260 400 L 1260 640" />
            <path id="s1" class="support" d="M 660 640 L 636 676 L 684 676 Z M 628 684 L 692 684" />
            <path id="s2" class="support" d="M 1260 640 L 1236 676 L 1284 676 Z M 1228 684 L 1292 684" />
            <circle class="node" cx="660" cy="400" r="9" />
            <circle class="node" cx="1260" cy="400" r="9" />
            <circle class="node" cx="660" cy="640" r="9" />
            <circle class="node" cx="1260" cy="640" r="9" />
          </svg>
        </div>

        <!-- DEPTH 3 · loads -->
        <div class="depth" id="dLoads">
          <svg viewBox="0 0 1920 1080" style="width: 100%; height: 100%" xmlns="http://www.w3.org/2000/svg">
            <g id="loadGroup" opacity="0">
              <path class="load-arrow" d="M 810 292 L 810 378" />
              <path class="load-arrow" d="M 799 364 L 810 382 L 821 364" />
              <path class="load-arrow" d="M 1110 292 L 1110 378" />
              <path class="load-arrow" d="M 1099 364 L 1110 382 L 1121 364" />
            </g>
            <g id="reactGroup" opacity="0">
              <path class="reaction-arrow" d="M 660 750 L 660 682" />
              <path class="reaction-arrow" d="M 649 696 L 660 678 L 671 696" />
              <path class="reaction-arrow" d="M 1260 750 L 1260 682" />
              <path class="reaction-arrow" d="M 1249 696 L 1260 678 L 1271 696" />
            </g>
          </svg>
        </div>

        <!-- DEPTH 4 · diagrams, each on its own plane -->
        <div class="depth" id="dDiag">
          <svg viewBox="0 0 1920 1080" style="width: 100%; height: 100%" xmlns="http://www.w3.org/2000/svg">
            <g id="gAx" opacity="0">
              <line x1="660" y1="800" x2="1260" y2="800" stroke="#2c3539" stroke-width="1.5" />
              <path id="pAx" fill="none" stroke="#6bcbf1" stroke-width="3" d="M 660 780 L 1260 780" />
            </g>
            <g id="gSh" opacity="0">
              <line x1="660" y1="880" x2="1260" y2="880" stroke="#2c3539" stroke-width="1.5" />
              <path id="pSh" fill="none" stroke="#78dc94" stroke-width="3" d="M 660 846 L 960 880 L 1260 914" />
            </g>
            <g id="gMo" opacity="0">
              <line x1="660" y1="980" x2="1260" y2="980" stroke="#2c3539" stroke-width="1.5" />
              <path id="pMo" fill="none" stroke="#ff79ac" stroke-width="3.5" d="M 660 980 Q 960 1064 1260 980" />
            </g>
            <g id="gDef" opacity="0">
              <path id="pDef" fill="none" stroke="#5bdae2" stroke-width="3" stroke-dasharray="9 7" d="M 660 640 L 656 400 Q 960 462 1264 400 L 1260 640" />
            </g>
          </svg>
        </div>

        <div class="vignette"></div>

        <!-- labels + values ride above the vignette -->
        <div class="depth" id="dChips">
          <div class="layer-label" id="lbGeom" style="top: 236px; color: #f1f5f4">Geometría</div>
          <div class="layer-label" id="lbLoads" style="top: 236px; color: #ff7d66">Cargas</div>
          <div class="layer-label" id="lbRes" style="top: 236px; color: #9baaff">Resultados</div>
          <div class="layer-label" id="lbDiag" style="top: 236px; color: #ff79ac">Diagramas</div>
          <div class="layer-label" id="lbCrit" style="top: 236px; color: #ffd56a">Valor crítico</div>

          <div class="chip load" id="chipP" style="left: 838px; top: 250px">P = 18.00 kN</div>
          <div class="chip reaction" id="chipR" style="left: 1300px; top: 736px">R = 41.20 kN</div>
          <div class="crit-ring" id="critRing" style="left: 924px; top: 986px"></div>
          <div class="chip crit" id="chipCrit" style="left: 1010px; top: 1000px">M máx = 54.30 kN·m</div>
        </div>

        <div class="beat" id="beat1" style="top: 800px">Menos ruido.</div>
        <div class="beat" id="beat2" style="top: 800px">Más concentración.</div>
        <div class="beat" id="beat3" style="top: 800px">Cada dato en su lugar.</div>

        <div class="closing" id="closing">
          <div class="kicker">structureCo</div>
          <div class="title">Laboratorio Nocturno</div>
        </div>
      </section>

      <audio id="bed" src="assets/bed.mp3" data-start="0" data-duration="24" data-track-index="10" data-volume="0.95"></audio>
      <audio id="sfx-grid" src="assets/whoosh-cinematic.mp3" data-start="0.60" data-duration="3.20" data-track-index="11" data-volume="0.13"></audio>
      <audio id="sfx-load" src="assets/click-soft.mp3" data-start="4.40" data-duration="0.36" data-track-index="12" data-volume="0.24"></audio>
      <audio id="sfx-react" src="assets/click.mp3" data-start="6.20" data-duration="0.36" data-track-index="12" data-volume="0.24"></audio>
      <audio id="sfx-l1" src="assets/whoosh-short.mp3" data-start="8.60" data-duration="0.57" data-track-index="13" data-volume="0.20"></audio>
      <audio id="sfx-l2" src="assets/whoosh-short.mp3" data-start="11.40" data-duration="0.57" data-track-index="13" data-volume="0.20"></audio>
      <audio id="sfx-d1" src="assets/click-soft.mp3" data-start="13.30" data-duration="0.36" data-track-index="14" data-volume="0.20"></audio>
      <audio id="sfx-d2" src="assets/click-soft.mp3" data-start="14.20" data-duration="0.36" data-track-index="14" data-volume="0.20"></audio>
      <audio id="sfx-d3" src="assets/click-soft.mp3" data-start="15.10" data-duration="0.36" data-track-index="14" data-volume="0.20"></audio>
      <audio id="sfx-crit" src="assets/ping.mp3" data-start="17.40" data-duration="1.32" data-track-index="15" data-volume="0.32"></audio>
      <audio id="sfx-close" src="assets/impact-bass-1.mp3" data-start="20.40" data-duration="2.10" data-track-index="16" data-volume="0.34"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      function prep(id) {
        const el = document.getElementById(id);
        const len = el.getTotalLength();
        el.style.strokeDasharray = `${len}`;
        el.style.strokeDashoffset = `${len}`;
      }
      ["beam", "colL", "colR", "s1", "s2", "pAx", "pSh", "pMo", "pDef"].forEach(prep);

      // ── the shot drifts through the model's depth layers ─────────────
      // Each layer moves at its own rate (parallax) and blurs as it leaves
      // the focal plane, so the piece reads as instrumentation being examined.
      const layers = [
        { el: document.getElementById("dGrid"), rate: 0.28 },
        { el: document.getElementById("dGeom"), rate: 0.62 },
        { el: document.getElementById("dLoads"), rate: 0.78 },
        { el: document.getElementById("dDiag"), rate: 0.95 },
        { el: document.getElementById("dChips"), rate: 0.95 },
      ];
      // focus: 0 = geometry plane, 1 = diagram plane
      const shot = { travel: 0, focus: 0, scale: 1.06 };
      const writeShot = () => {
        layers.forEach((l, i) => {
          const y = -shot.travel * l.rate;
          l.el.style.transform = `translateY(${y}px) scale(${shot.scale})`;
          // depth of field: distance from the focal index
          const focalIndex = 1 + shot.focus * 2;
          const d = Math.abs(i - focalIndex);
          const blur = Math.min(d * 1.5, 4.5);
          l.el.style.filter = blur > 0.15 ? `blur(${blur.toFixed(2)}px)` : "none";
        });
      };
      writeShot();

      // ---------- 0–4s · the grid comes up ----------
      tl.to("#gridRect", { opacity: 0.5, duration: 2.2, ease: "power2.out" }, 0.4);
      tl.to("#axH", { opacity: 0.7, duration: 1.0, ease: "power2.out" }, 1.4);
      tl.to("#axV", { opacity: 0.7, duration: 1.0, ease: "power2.out" }, 1.6);
      tl.to("#beam", { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, 1.2);
      tl.to("#colL", { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 1.8);
      tl.to("#colR", { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 2.0);
      tl.to("#s1", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 2.6);
      tl.to("#s2", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 2.6);
      tl.to("#lbGeom", { opacity: 1, duration: 0.6, ease: "power3.out" }, 2.4);

      // ---------- 4–8s · loads, then reactions ----------
      tl.to("#loadGroup", { opacity: 1, duration: 0.7, ease: "power3.out" }, 4.4);
      tl.fromTo("#chipP", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.7);
      tl.to("#lbGeom", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.3);
      tl.to("#lbLoads", { opacity: 1, duration: 0.6, ease: "power3.out" }, 4.6);
      tl.to("#beat1", { opacity: 1, duration: 0.7, ease: "power3.out" }, 5.0);

      tl.to("#reactGroup", { opacity: 1, duration: 0.7, ease: "power3.out" }, 6.2);
      tl.fromTo("#chipR", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 6.5);
      tl.to("#lbLoads", { opacity: 0, duration: 0.4, ease: "power2.in" }, 6.9);
      tl.to("#lbRes", { opacity: 1, duration: 0.6, ease: "power3.out" }, 7.2);

      // ---------- 8.6–12s · the shot travels down through the layers ----------
      tl.to(shot, { travel: 150, duration: 3.0, ease: "power2.inOut", onUpdate: writeShot }, 8.6);
      tl.to("#beat1", { opacity: 0, duration: 0.5, ease: "power2.in" }, 8.4);
      tl.to("#beat2", { opacity: 1, duration: 0.7, ease: "power3.out" }, 9.2);
      tl.to("#lbRes", { opacity: 0, duration: 0.4, ease: "power2.in" }, 11.2);

      // ---------- 11.4–17s · focus racks onto the diagram plane ----------
      tl.to(shot, { focus: 1, duration: 2.0, ease: "power2.inOut", onUpdate: writeShot }, 11.4);
      tl.to(shot, { travel: 250, duration: 4.0, ease: "power1.inOut", onUpdate: writeShot }, 11.6);
      tl.to("#lbDiag", { opacity: 1, duration: 0.6, ease: "power3.out" }, 12.6);

      tl.to("#gAx", { opacity: 1, duration: 0.5, ease: "power2.out" }, 13.3);
      tl.to("#pAx", { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 13.3);
      tl.to("#gSh", { opacity: 1, duration: 0.5, ease: "power2.out" }, 14.2);
      tl.to("#pSh", { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 14.2);
      tl.to("#gMo", { opacity: 1, duration: 0.5, ease: "power2.out" }, 15.1);
      tl.to("#pMo", { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" }, 15.1);
      tl.to("#gDef", { opacity: 0.85, duration: 0.5, ease: "power2.out" }, 16.0);
      tl.to("#pDef", { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" }, 16.0);

      tl.to("#beat2", { opacity: 0, duration: 0.5, ease: "power2.in" }, 15.6);

      // ---------- 17.4–20s · the critical value locks in ----------
      tl.to("#lbDiag", { opacity: 0, duration: 0.4, ease: "power2.in" }, 17.1);
      tl.to("#lbCrit", { opacity: 1, duration: 0.6, ease: "power3.out" }, 17.4);
      tl.fromTo("#critRing", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 17.4);
      tl.fromTo("#chipCrit", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 17.7);
      tl.to("#beat3", { opacity: 1, duration: 0.7, ease: "power3.out" }, 18.2);

      // ---------- 20.4–24s · close ----------
      tl.to("#beat3", { opacity: 0, duration: 0.6, ease: "power2.in" }, 20.0);
      tl.to("#lbCrit", { opacity: 0, duration: 0.6, ease: "power2.in" }, 20.0);
      tl.to("#dGrid, #dGeom, #dLoads, #dDiag, #dChips", { opacity: 0.13, duration: 1.4, ease: "power2.inOut" }, 20.2);
      tl.to("#closing", { opacity: 1, duration: 1.1, ease: "power3.out" }, 20.9);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
