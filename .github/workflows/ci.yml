# Gate rápido — structureCo
#
# Se ejecuta en cada push a main y en cada pull request. Comprueba documentación, lint,
# tipos, frontera matemática protegida, pruebas, build y presupuesto de rendimiento. No
# llama modelos de IA, automatiza navegadores, despliega, commitea, etiqueta ni publica.

name: Gate rápido

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. This workflow never needs to write to the repository, open issues,
# or touch packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, frontera protegida, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node canónico
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Documentación canónica
        run: npm run verify:docs

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: Frontera matemática protegida
        run: npm run verify:protected

      - name: Contrato del service worker
        run: npm run verify:pwa

      - name: Catálogo de traducción sin claves muertas
        run: npm run verify:i18n

      - name: Pruebas deterministas
        run: npm test

      # `npm test` ya cubre las pruebas unitarias de Space 3D; lo que faltaba en
      # el gate era la política de capacidad y el contrato de los 80 PNG
      # estructurales, que hasta ahora sólo se ejecutaban a mano. Entre los dos
      # añaden ~21 s a un gate con techo de 15 min.
      - name: Capacidad de Space 3D
        run: npm run verify:space3d

      - name: Contrato de assets estructurales
        run: npm run verify:structural-assets

      - name: Build de producción
        run: npm run build

      - name: Presupuestos de rendimiento
        run: npm run verify:perf

      # `dist/` queda disponible durante unos días también cuando el gate pasa. Esto
      # permite auditar o publicar exactamente el build que GitHub verificó, sin
      # introducir lógica de deploy ni permisos de escritura en CI.
      - name: Conservar build verificado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-rapido-dist
          path: dist/
          retention-days: 5
          if-no-files-found: ignore
